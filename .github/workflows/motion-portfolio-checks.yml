name: Motion portfolio checks

on:
  push:
    branches:
      - feat/motion-portfolio-reel
    paths:
      - "motion/portfolio-reel/**"
      - ".github/workflows/motion-portfolio-checks.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: motion/portfolio-reel
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          if [ "${GITHUB_ACTOR}" = "github-actions[bot]" ]; then
            npm ci
          else
            npm install
          fi

      - name: Persist generated package lock
        if: github.actor != 'github-actions[bot]'
        run: |
          if [ -z "$(git status --porcelain -- package-lock.json)" ]; then
            echo "package-lock.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: lock enterprise motion dependencies"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Report dependency audit
        run: npm audit || true

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Dev server smoke
        run: |
          set +e
          timeout 8s npm run dev > /tmp/motion-dev.log 2>&1
          code=$?
          set -e
          cat /tmp/motion-dev.log
          if [ "$code" -ne 124 ]; then
            exit "$code"
          fi
          grep -Eq "Local:|ready in" /tmp/motion-dev.log

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run static carousel regression
        run: |
          python -m pip install pytest
          cd ../..
          python -m pytest tests/test_build_social_carousel.py -q

      - name: Confirm static renderer contract is untouched
        run: |
          cd ../..
          git diff --exit-code origin/main -- portfolio/social_carousel.json scripts/build_social_carousel.py
