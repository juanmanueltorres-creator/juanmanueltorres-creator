name: Refresh profile player stats

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'assets/player-stats.svg'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-player-stats
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Verify stats renderer
        run: python -m unittest discover -s tests -p 'test_profile_stats.py'

      - name: Render public GitHub stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/profile_stats.py

      - name: Commit refreshed stats
        run: |
          if git diff --quiet -- assets/player-stats.svg; then
            echo "No stats changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/player-stats.svg
          git commit -m "Refresh profile player stats"
          git push
