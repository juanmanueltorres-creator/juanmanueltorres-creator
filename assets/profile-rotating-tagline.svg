<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="86" viewBox="0 0 1100 86" role="img" aria-labelledby="title desc">
  <title id="title">Juan Manuel Torres — animated profile signal</title>
  <desc id="desc">GeoPlatform, Anti IA, geosciences, spatial data and territorial intelligence shown as a staggered animated profile signal.</desc>

  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#33d1ff"/>
      <stop offset="0.5" stop-color="#b56cff"/>
      <stop offset="1" stop-color="#ff4fb7"/>
    </linearGradient>

    <linearGradient id="accentSoft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#162437"/>
      <stop offset="0.5" stop-color="#211a38"/>
      <stop offset="1" stop-color="#30182e"/>
    </linearGradient>

    <style>
      .bg {
        fill: #0d1117;
        stroke: #30363d;
        stroke-width: 1;
      }

      .inner {
        fill: url(#accentSoft);
        opacity: .23;
      }

      .kicker {
        fill: #c8d4eb;
        font-family: "Courier New", "Lucida Console", Monaco, monospace;
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 2.35px;
      }

      .phrase {
        fill: #f4f8ff;
        font-family: "Arial Black", "Franklin Gothic Heavy", Impact, "Segoe UI", sans-serif;
        font-size: 20px;
        font-weight: 900;
        letter-spacing: .15px;
        paint-order: stroke fill;
        stroke: #070b12;
        stroke-width: .75px;
      }

      .char {
        transform-box: fill-box;
        transform-origin: center;
      }

      .p1 .char {
        opacity: 1;
        animation: char1 12s cubic-bezier(.18,.72,.22,1) infinite;
      }

      .p2 .char {
        opacity: 0;
        animation: char2 12s cubic-bezier(.18,.72,.22,1) infinite;
      }

      .p3 .char {
        opacity: 0;
        animation: char3 12s cubic-bezier(.18,.72,.22,1) infinite;
      }

      @keyframes char1 {
        0%   { opacity: 0; transform: translateY(8px) scale(.94); }
        5%   { opacity: 1; transform: translateY(-2px) scale(1.02); }
        8%   { opacity: 1; transform: translateY(0) scale(1); }
        24%  { opacity: 1; transform: translateY(0) scale(1); }
        27%  { opacity: .92; transform: translateX(-1px); }
        30%,100% { opacity: 0; transform: translateY(-5px); }
      }

      @keyframes char2 {
        0%,32% { opacity: 0; transform: translateY(8px) scale(.94); }
        37%  { opacity: 1; transform: translateY(-2px) scale(1.02); }
        40%  { opacity: 1; transform: translateY(0) scale(1); }
        57%  { opacity: 1; transform: translateY(0) scale(1); }
        60%  { opacity: .92; transform: translateX(1px); }
        63%,100% { opacity: 0; transform: translateY(-5px); }
      }

      @keyframes char3 {
        0%,65% { opacity: 0; transform: translateY(8px) scale(.94); }
        70%  { opacity: 1; transform: translateY(-2px) scale(1.02); }
        73%  { opacity: 1; transform: translateY(0) scale(1); }
        90%  { opacity: 1; transform: translateY(0) scale(1); }
        93%  { opacity: .92; transform: translateX(-1px); }
        96%,100% { opacity: 0; transform: translateY(-5px); }
      }

      .ghost {
        font-family: "Arial Black", "Franklin Gothic Heavy", Impact, "Segoe UI", sans-serif;
        font-size: 20px;
        font-weight: 900;
        letter-spacing: .15px;
        opacity: 0;
      }

      .cyan { fill: #33d1ff; }
      .pink { fill: #ff4fb7; }

      .g1a { animation: ghost1a 12s linear infinite; }
      .g1b { animation: ghost1b 12s linear infinite; }
      .g2a { animation: ghost2a 12s linear infinite; }
      .g2b { animation: ghost2b 12s linear infinite; }
      .g3a { animation: ghost3a 12s linear infinite; }
      .g3b { animation: ghost3b 12s linear infinite; }

      @keyframes ghost1a {
        0%,25%,30%,100% { opacity:0; transform:translateX(0); }
        26.5% { opacity:.32; transform:translateX(-3px); }
        28% { opacity:.14; transform:translateX(2px); }
      }
      @keyframes ghost1b {
        0%,25%,30%,100% { opacity:0; transform:translateX(0); }
        27% { opacity:.28; transform:translateX(3px); }
        28.5% { opacity:.10; transform:translateX(-2px); }
      }
      @keyframes ghost2a {
        0%,58%,63%,100% { opacity:0; transform:translateX(0); }
        59.5% { opacity:.32; transform:translateX(-3px); }
        61% { opacity:.14; transform:translateX(2px); }
      }
      @keyframes ghost2b {
        0%,58%,63%,100% { opacity:0; transform:translateX(0); }
        60% { opacity:.28; transform:translateX(3px); }
        61.5% { opacity:.10; transform:translateX(-2px); }
      }
      @keyframes ghost3a {
        0%,91%,96%,100% { opacity:0; transform:translateX(0); }
        92.5% { opacity:.32; transform:translateX(-3px); }
        94% { opacity:.14; transform:translateX(2px); }
      }
      @keyframes ghost3b {
        0%,91%,96%,100% { opacity:0; transform:translateX(0); }
        93% { opacity:.28; transform:translateX(3px); }
        94.5% { opacity:.10; transform:translateX(-2px); }
      }

      .rail {
        stroke: url(#accent);
        stroke-width: 1.8;
        stroke-linecap: round;
        opacity: .82;
        filter: drop-shadow(0 0 7px rgba(120,110,255,.18));
      }

      .scan {
        stroke: url(#accent);
        stroke-width: 3;
        stroke-linecap: round;
        stroke-dasharray: 72 500;
        opacity: 0;
        filter: drop-shadow(0 0 8px rgba(181,108,255,.28));
        animation: scanCycle 12s linear infinite;
      }

      @keyframes scanCycle {
        0%,24% { opacity:0; stroke-dashoffset:470; }
        26% { opacity:.9; stroke-dashoffset:470; }
        30% { opacity:0; stroke-dashoffset:-470; }
        31%,57% { opacity:0; stroke-dashoffset:470; }
        59% { opacity:.9; stroke-dashoffset:470; }
        63% { opacity:0; stroke-dashoffset:-470; }
        64%,90% { opacity:0; stroke-dashoffset:470; }
        92% { opacity:.9; stroke-dashoffset:470; }
        96% { opacity:0; stroke-dashoffset:-470; }
        100% { opacity:0; stroke-dashoffset:470; }
      }

      @media (prefers-reduced-motion: reduce) {
        .char, .ghost, .scan {
          animation: none !important;
          transform: none !important;
        }
        .p1 .char { opacity: 1 !important; }
        .p2 .char, .p3 .char, .ghost, .scan { opacity: 0 !important; }
      }
    </style>
  </defs>

  <rect class="bg" x="1" y="1" width="1098" height="84" rx="16"/>
  <rect class="inner" x="12" y="12" width="1076" height="60" rx="12"/>

  <text x="550" y="22" text-anchor="middle" class="kicker">
    BUILDING AT THE INTERSECTION OF TERRITORY · DATA · SOFTWARE
  </text>

  <g aria-hidden="true">
    <text x="550" y="51" text-anchor="middle" class="ghost cyan g1a">GeoPlatform · Anti IA · Territorial Intelligence</text>
    <text x="550" y="51" text-anchor="middle" class="ghost pink g1b">GeoPlatform · Anti IA · Territorial Intelligence</text>
    <text x="550" y="51" text-anchor="middle" class="ghost cyan g2a">Geosciences · Spatial Data · AI-assisted Software</text>
    <text x="550" y="51" text-anchor="middle" class="ghost pink g2b">Geosciences · Spatial Data · AI-assisted Software</text>
    <text x="550" y="51" text-anchor="middle" class="ghost cyan g3a">Maps, data and context for territorial intelligence</text>
    <text x="550" y="51" text-anchor="middle" class="ghost pink g3b">Maps, data and context for territorial intelligence</text>
  </g>

