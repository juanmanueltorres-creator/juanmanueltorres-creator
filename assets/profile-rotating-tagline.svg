<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="78" viewBox="0 0 1100 78" role="img" aria-labelledby="title desc">
  <title id="title">Juan Manuel Torres — rotating profile tagline</title>
  <desc id="desc">Animated profile tagline rotating between GeoPlatform and Anti IA, geosciences and spatial data, and territorial intelligence.</desc>

  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f6747"/>
      <stop offset="0.5" stop-color="#d2a06a"/>
      <stop offset="1" stop-color="#8f6747"/>
    </linearGradient>
    <style>
      .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1; }
      .rail { stroke: url(#accent); stroke-width: 2; stroke-linecap: round; }
      .dot { fill: #d2a06a; }
      .label {
        fill: #f0f6fc;
        font-family: Inter, Segoe UI, Arial, sans-serif;
        font-size: 18px;
        font-weight: 650;
        letter-spacing: .25px;
      }
      .mono {
        fill: #8b949e;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 1.6px;
      }
      .line1 { animation: show1 12s ease-in-out infinite; }
      .line2 { animation: show2 12s ease-in-out infinite; opacity: 0; }
      .line3 { animation: show3 12s ease-in-out infinite; opacity: 0; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: 56px 39px; }
      @keyframes show1 {
        0%, 27% { opacity: 1; transform: translateY(0); }
        31%, 96% { opacity: 0; transform: translateY(-5px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes show2 {
        0%, 29% { opacity: 0; transform: translateY(5px); }
        34%, 60% { opacity: 1; transform: translateY(0); }
        65%, 100% { opacity: 0; transform: translateY(-5px); }
      }
      @keyframes show3 {
        0%, 63% { opacity: 0; transform: translateY(5px); }
        68%, 94% { opacity: 1; transform: translateY(0); }
        99%, 100% { opacity: 0; transform: translateY(-5px); }
      }
      @keyframes pulse {
        0%,100% { opacity: .45; transform: scale(.8); }
        50% { opacity: 1; transform: scale(1.12); }
      }
      @media (prefers-reduced-motion: reduce) {
        .line1 { animation: none; opacity: 1; }
        .line2, .line3 { animation: none; opacity: 0; }
        .pulse { animation: none; }
      }
    </style>
  </defs>

  <rect x="1" y="1" width="1098" height="76" rx="14" class="bg"/>
  <line x1="28" y1="18" x2="28" y2="60" class="rail"/>
  <circle cx="56" cy="39" r="4" class="dot pulse"/>
  <text x="80" y="23" class="mono">BUILDING AT THE INTERSECTION OF TERRITORY · DATA · SOFTWARE</text>

  <g aria-live="polite">
    <text x="80" y="52" class="label line1">GeoPlatform · Anti IA · Territorial Intelligence</text>
    <text x="80" y="52" class="label line2">Geosciences · Spatial Data · AI-assisted Software</text>
    <text x="80" y="52" class="label line3">Maps, data and context for territorial intelligence</text>
  </g>
</svg>
