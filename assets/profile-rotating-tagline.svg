<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="104" viewBox="0 0 1100 104" role="img" aria-labelledby="title desc">
  <title id="title">Juan Manuel Torres — territorial archive</title>
  <desc id="desc">Dark cinematic banner for GeoPlatform, Anti IA and territorial intelligence.</desc>
  <defs>
    <linearGradient id="ember" x1="0" x2="1">
      <stop offset="0" stop-color="#6f4627"/>
      <stop offset=".34" stop-color="#c99755"/>
      <stop offset=".58" stop-color="#e5d2a8"/>
      <stop offset=".82" stop-color="#8f2f2f"/>
      <stop offset="1" stop-color="#4b1919"/>
    </linearGradient>
    <linearGradient id="void" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080706"/>
      <stop offset=".52" stop-color="#120f0c"/>
      <stop offset="1" stop-color="#160b0b"/>
    </linearGradient>
    <radialGradient id="warmth">
      <stop offset="0" stop-color="#6f4627" stop-opacity=".16"/>
      <stop offset=".62" stop-color="#27170f" stop-opacity=".06"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <style>
      .bg{fill:url(#void);stroke:#3a2b20;stroke-width:1}
      .inner{fill:url(#warmth);stroke:#2d241d;stroke-width:1}
      .cut{stroke:#c99755;stroke-width:1;opacity:.34}
      .kicker{fill:#9f8e75;font-family:"Courier New",monospace;font-size:10px;font-weight:700;letter-spacing:2.8px}
      .phrase{fill:#eadfc9;font-family:Georgia,"Times New Roman",serif;font-size:24px;font-weight:700;letter-spacing:.35px;paint-order:stroke fill;stroke:#050403;stroke-width:.8px;filter:drop-shadow(0 0 8px rgba(201,151,85,.12))}
      .etch{fill:none;stroke:url(#ember);stroke-width:.55px;opacity:0;stroke-dasharray:9 7;filter:drop-shadow(0 0 5px rgba(143,47,47,.2))}
      .p1{animation:act1 13.5s ease-in-out infinite}.p2{animation:act2 13.5s ease-in-out infinite;opacity:0}.p3{animation:act3 13.5s ease-in-out infinite;opacity:0}
      .e1{animation:etch1 13.5s linear infinite}.e2{animation:etch2 13.5s linear infinite}.e3{animation:etch3 13.5s linear infinite}
      @keyframes act1{0%{opacity:0;transform:translateY(7px)}5%,25%{opacity:1;transform:translateY(0)}28%{opacity:.55}31%,100%{opacity:0;transform:translateY(-4px)}}
      @keyframes act2{0%,33%{opacity:0;transform:translateY(7px)}38%,58%{opacity:1;transform:translateY(0)}61%{opacity:.55}64%,100%{opacity:0;transform:translateY(-4px)}}
      @keyframes act3{0%,66%{opacity:0;transform:translateY(7px)}71%,91%{opacity:1;transform:translateY(0)}94%{opacity:.55}97%,100%{opacity:0;transform:translateY(-4px)}}
      @keyframes etch1{0%,2%,31%,100%{opacity:0;stroke-dashoffset:80}6%{opacity:.55;stroke-dashoffset:0}12%,25%{opacity:.12;stroke-dashoffset:-20}}
      @keyframes etch2{0%,35%,64%,100%{opacity:0;stroke-dashoffset:80}39%{opacity:.55;stroke-dashoffset:0}45%,58%{opacity:.12;stroke-dashoffset:-20}}
      @keyframes etch3{0%,68%,97%,100%{opacity:0;stroke-dashoffset:80}72%{opacity:.55;stroke-dashoffset:0}78%,91%{opacity:.12;stroke-dashoffset:-20}}
      .rail{stroke:url(#ember);stroke-width:1.2;opacity:.62}.scan{stroke:url(#ember);stroke-width:2.5;stroke-dasharray:70 600;opacity:0;filter:drop-shadow(0 0 7px rgba(201,151,85,.24));animation:scan 13.5s linear infinite}
      @keyframes scan{0%,26%{opacity:0;stroke-dashoffset:520}28%{opacity:.75}31%{opacity:0;stroke-dashoffset:-520}32%,59%{opacity:0;stroke-dashoffset:520}61%{opacity:.75}64%{opacity:0;stroke-dashoffset:-520}65%,92%{opacity:0;stroke-dashoffset:520}94%{opacity:.75}97%,100%{opacity:0;stroke-dashoffset:-520}}
      @media (prefers-reduced-motion:reduce){.p1,.p2,.p3,.e1,.e2,.e3,.scan{animation:none!important;transform:none!important}.p1{opacity:1!important}.p2,.p3,.etch,.scan{opacity:0!important}}
    </style>
  </defs>
  <rect class="bg" x="1" y="1" width="1098" height="102" rx="15"/>
  <rect class="inner" x="10" y="10" width="1080" height="84" rx="11"/>
  <path class="cut" d="M28 22h84m876 0h84M28 82h84m876 0h84M28 22v12m1044-12v12M28 70v12m1044-12v12"/>
  <text x="550" y="27" text-anchor="middle" class="kicker">ARCHIVE OF TERRITORY · DATA · SOFTWARE</text>
  <g>
    <text x="550" y="61" text-anchor="middle" class="phrase p1">GeoPlatform · Anti IA · Territorial Intelligence</text>
    <text x="550" y="61" text-anchor="middle" class="etch e1">GeoPlatform · Anti IA · Territorial Intelligence</text>
    <text x="550" y="61" text-anchor="middle" class="phrase p2">Geosciences · Spatial Data · AI-assisted Software</text>
    <text x="550" y="61" text-anchor="middle" class="etch e2">Geosciences · Spatial Data · AI-assisted Software</text>
    <text x="550" y="61" text-anchor="middle" class="phrase p3">Maps, data and context for territorial intelligence</text>
    <text x="550" y="61" text-anchor="middle" class="etch e3">Maps, data and context for territorial intelligence</text>
  </g>
  <line class="rail" x1="260" y1="79" x2="840" y2="79"/>
  <line class="scan" x1="260" y1="79" x2="840" y2="79"/>
</svg>