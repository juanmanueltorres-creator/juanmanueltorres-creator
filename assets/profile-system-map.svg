    <circle r="22" class="node"/>
    <rect x="-54" y="-78" width="108" height="44" rx="12" class="chip"/>
    <text x="0" y="-55" text-anchor="middle" class="title">Territory</text>
    <text x="0" y="-38" text-anchor="middle" class="small">geology · routes · climate</text>
  </g>

