    <path d="M142.1 367.5 L134.1 367.9 L129.8 364.9 L124.7 364.7 L115.6 364.7 L115.6 345.9 L118.9 349.8 L123.1 356.1 L134.1 361.2 L145.9 363.3 L142.1 367.5 Z" class="map"/>
    <path d="M91 122 C118 111 143 116 205 101 M88 153 C121 141 151 146 216 129 M87 187 C124 174 153 181 221 161 M91 225 C127 212 158 217 221 198 M98 266 C134 253 161 259 218 240 M108 306 C140 296 166 299 211 284" fill="none" stroke="#2e2b27" stroke-width="1" opacity=".75"/>
    <text x="82" y="387" class="nodeTitle">Territory</text><text x="82" y="403" class="micro">ARGENTINA · signals · geology · routes</text>

    <circle cx="153.2" cy="167.2" r="4" fill="#d0a069" filter="url(#glow)" class="pulse"/>
    <circle cx="116.5" cy="168.2" r="3.5" fill="#947356" class="pulse2"/>
    <circle cx="107.0" cy="142.5" r="3" fill="#765044"/>
    <circle cx="153.2" cy="167.2" r="23" fill="none" stroke="#b48759" stroke-width="1" class="scan"/>

    <path d="M153.2 167.2 C250 205 278 205 314 205" class="flow"/>
    <text x="70" y="73" class="micro">signals · geology · routes · climate · satellite</text>
  </g>

  <path d="M314 205 C350 205 365 174 402 174 C439 174 450 205 486 205 C526 205 540 236 580 236 C619 236 635 205 674 205 C714 205 729 174 770 174 C811 174 826 205 865 205 C904 205 921 236 958 236 C995 236 1012 205 1050 205" class="flow"/>
  <path d="M314 214 C350 214 366 245 402 245 C438 245 451 214 486 214 C526 214 541 183 580 183 C620 183 635 214 674 214 C714 214 730 245 770 245 C810 245 826 214 865 214 C904 214 921 183 958 183 C996 183 1013 214 1050 214" class="flow2"/>

  <g transform="translate(326 205)"><circle r="20" class="node"/><circle r="7" fill="#b4865a"/><text x="0" y="-40" text-anchor="middle" class="nodeTitle">PostGIS</text><text x="0" y="-25" text-anchor="middle" class="nodeSub">spatial data</text></g>
  <g transform="translate(492 205)"><circle r="20" class="node"/><circle r="7" fill="#a17956"/><text x="0" y="51" text-anchor="middle" class="nodeTitle">FastAPI</text><text x="0" y="66" text-anchor="middle" class="nodeSub">backend · APIs</text></g>
  <g transform="translate(674 205)"><circle r="20" class="node"/><circle r="7" fill="#baa07d"/><text x="0" y="-40" text-anchor="middle" class="nodeTitle">React / Cesium</text><text x="0" y="-25" text-anchor="middle" class="nodeSub">2D/3D product</text></g>
  <g transform="translate(865 205)"><circle r="20" class="node"/><circle r="7" fill="#8e6d58"/><text x="0" y="51" text-anchor="middle" class="nodeTitle">LLM / Agents</text><text x="0" y="66" text-anchor="middle" class="nodeSub">tools · workflows</text></g>
  <g transform="translate(1050 205)"><circle r="20" class="node"/><circle r="7" fill="#c79b63" filter="url(#glow)" class="pulse"/><text x="0" y="-40" text-anchor="middle" class="nodeTitle">Decision Context</text><text x="0" y="-25" text-anchor="middle" class="nodeSub">traceable · operational</text></g>

  <g transform="translate(319 320)">
    <text class="micro">TERRITORY</text><path d="M0 12H731" stroke="#282521"/>
    <text x="145" class="micro">DATA</text><text x="287" class="micro">BACKEND</text><text x="430" class="micro">MAPS</text><text x="555" class="micro">AI SYSTEMS</text><text x="678" class="micro">CONTEXT</text>
  </g>

  <text x="319" y="363" class="quote">A map should not just show a point. It should help explain what surrounds it.</text>
  <text x="319" y="386" class="micro">geology · spatial data · backend · maps · agentic workflows</text>
</svg>