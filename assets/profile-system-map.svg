<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc" data-theme="anti-ia-atlas-v2">
  <title id="title">A coordinate is not knowledge — territorial atlas</title>
  <desc id="desc">A dark editorial map of Argentina with territorial signals, a route, and questions about evidence, change, sources, and decisions.</desc>

  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="46%" r="58%">
      <stop offset="0" stop-color="#12100d"/>
      <stop offset="0.45" stop-color="#090909"/>
      <stop offset="1" stop-color="#030303"/>
    </radialGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8f6237"/>
      <stop offset="0.5" stop-color="#d1a06b"/>
      <stop offset="1" stop-color="#7e3e37"/>
    </linearGradient>
    <filter id="softGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="argClip">
      <path d="M616 80 C599 92 592 108 591 123 C589 140 576 150 579 166 C582 181 574 196 578 213 C581 229 574 243 582 258 C590 273 586 289 595 303 C605 320 604 337 618 354 C625 364 632 374 639 382 C648 374 655 361 658 347 C661 333 672 321 670 306 C668 290 679 279 675 264 C671 250 680 235 674 220 C668 206 675 193 668 180 C661 166 666 153 655 141 C647 132 648 118 639 108 C631 99 628 88 616 80 Z"/>
    </clipPath>
    <style>
      .kicker{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10px;font-weight:600;letter-spacing:2.2px;fill:#9a7b5e}
      .headline{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:31px;font-weight:700;fill:#ebe6df}
      .body{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:13px;font-weight:400;fill:#8f8b85}
      .micro{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10px;font-weight:500;fill:#6d6862;letter-spacing:.7px}
      .question{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:14px;font-weight:600;fill:#d9d4cd;letter-spacing:.3px}
      .coord{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:9px;font-weight:500;fill:#6d6862}
      .hair{stroke:#22201e;stroke-width:1;fill:none}
      .contour{stroke:#312d29;stroke-width:1;fill:none;opacity:.62}
      .route{stroke:url(#route);stroke-width:2.2;fill:none;stroke-linecap:round;stroke-dasharray:5 8;animation:moveRoute 8s linear infinite}
      .scan{animation:scanPulse 4.4s ease-out infinite;transform-origin:center}
      .signal{animation:signalPulse 3.2s ease-in-out infinite;transform-origin:center}
      .signal2{animation:signalPulse 3.2s ease-in-out 1.1s infinite;transform-origin:center}
      .signal3{animation:signalPulse 3.2s ease-in-out 2.1s infinite;transform-origin:center}
      .qline{animation:qFade 6s ease-in-out infinite}
      .q2{animation-delay:1.2s}.q3{animation-delay:2.4s}.q4{animation-delay:3.6s}
      @keyframes moveRoute{to{stroke-dashoffset:-130}}
      @keyframes scanPulse{0%{opacity:.65;transform:scale(.4)}75%,100%{opacity:0;transform:scale(1.35)}}
      @keyframes signalPulse{0%,100%{opacity:.55;transform:scale(.92)}50%{opacity:1;transform:scale(1.12)}}
      @keyframes qFade{0%,100%{opacity:.35}18%,55%{opacity:1}75%{opacity:.35}}
    </style>
  </defs>

  <rect width="1200" height="420" rx="22" fill="url(#bgGlow)"/>
  <rect x="1" y="1" width="1198" height="418" rx="21" fill="none" stroke="#181716"/>

  <g opacity=".52">
    <path d="M42 74H1158M42 142H1158M42 210H1158M42 278H1158M42 346H1158" class="hair"/>
    <path d="M122 34V386M282 34V386M442 34V386M602 34V386M762 34V386M922 34V386M1082 34V386" class="hair"/>
  </g>

  <g transform="translate(62 72)">
    <text class="kicker">ANTI IA / TERRITORIAL SYSTEMS</text>
    <text y="54" class="headline">A coordinate is not knowledge.</text>
    <text y="84" class="body">Data becomes useful when territory, source, time and context meet.</text>
    <text y="105" class="body">Software can connect the pieces. It should not hide the uncertainty.</text>

    <g transform="translate(0 164)">
      <path d="M0 0H316" stroke="#292622"/>
      <text y="26" class="micro">FROM ARGENTINA · BUILT BETWEEN GEOSCIENCES + SOFTWARE</text>
      <text y="47" class="micro">territory · evidence · context · software</text>
    </g>
  </g>

  <g>
    <text x="564" y="42" class="coord">ARG / 38°S · 64°W</text>

    <path d="M616 80 C599 92 592 108 591 123 C589 140 576 150 579 166 C582 181 574 196 578 213 C581 229 574 243 582 258 C590 273 586 289 595 303 C605 320 604 337 618 354 C625 364 632 374 639 382 C648 374 655 361 658 347 C661 333 672 321 670 306 C668 290 679 279 675 264 C671 250 680 235 674 220 C668 206 675 193 668 180 C661 166 666 153 655 141 C647 132 648 118 639 108 C631 99 628 88 616 80 Z" fill="#090909" stroke="#777069" stroke-width="1.4"/>

    <g clip-path="url(#argClip)">
      <path d="M551 122C585 105 624 111 687 93" class="contour"/>
      <path d="M550 144C591 125 624 134 690 116" class="contour"/>
      <path d="M551 169C587 149 627 157 692 140" class="contour"/>
      <path d="M551 194C596 176 631 181 694 165" class="contour"/>
      <path d="M552 220C590 201 633 207 695 190" class="contour"/>
      <path d="M556 248C596 229 635 234 696 217" class="contour"/>
      <path d="M563 278C601 260 641 266 696 247" class="contour"/>
      <path d="M570 307C607 294 640 297 690 280" class="contour"/>
      <path d="M583 337C610 326 638 329 678 314" class="contour"/>
    </g>

    <path d="M608 155 C594 181 610 198 598 220 C588 239 610 251 609 275 C607 300 627 318 634 345" class="route"/>

    <circle cx="603" cy="221" r="42" fill="none" stroke="#b98a5a" stroke-width="1.2" class="scan"/>
    <circle cx="603" cy="221" r="4" fill="#d4a46f" filter="url(#softGlow)" class="signal"/>
    <circle cx="611" cy="154" r="3.5" fill="#9a7757" class="signal2"/>
    <circle cx="634" cy="344" r="3.5" fill="#824640" class="signal3"/>

    <path d="M603 221H520L489 205" stroke="#4f473f" stroke-width="1" stroke-dasharray="3 5"/>
    <text x="444" y="201" class="coord">AOI / context</text>
    <text x="444" y="216" class="coord">source ≠ conclusion</text>

    <path d="M611 154H693L718 135" stroke="#4f473f" stroke-width="1" stroke-dasharray="3 5"/>
    <text x="724" y="132" class="coord">signal / 01</text>
    <text x="724" y="147" class="coord">needs validation</text>
  </g>

  <g transform="translate(826 96)">
    <text class="kicker">BEFORE THE ANSWER</text>

    <g transform="translate(0 54)" class="qline">
      <circle cx="4" cy="-5" r="3.5" fill="#b98a5a"/>
      <text x="22" class="question">WHAT DO WE KNOW?</text>
      <path d="M22 13H276" stroke="#292622"/>
    </g>
    <g transform="translate(0 108)" class="qline q2">
      <circle cx="4" cy="-5" r="3.5" fill="#7e6a58"/>
      <text x="22" class="question">WHAT CHANGED?</text>
      <path d="M22 13H276" stroke="#292622"/>
    </g>
    <g transform="translate(0 162)" class="qline q3">
      <circle cx="4" cy="-5" r="3.5" fill="#8a4e47"/>
      <text x="22" class="question">SOURCE?</text>
      <path d="M22 13H276" stroke="#292622"/>
    </g>
    <g transform="translate(0 216)" class="qline q4">
      <circle cx="4" cy="-5" r="3.5" fill="#c08d59"/>
      <text x="22" class="question">WHO DECIDES?</text>
      <path d="M22 13H276" stroke="#292622"/>
    </g>

    <text y="292" class="micro">MAP ≠ TERRITORY · DATA ≠ EVIDENCE · AI ≠ AUTHORITY</text>
  </g>

  <g transform="translate(62 382)">
    <circle r="3" fill="#d4a46f"/>
    <text x="12" y="3" class="micro">observed signal</text>
    <path d="M118 0H148" stroke="#8e6037" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="158" y="3" class="micro">context route</text>
  </g>
</svg>
