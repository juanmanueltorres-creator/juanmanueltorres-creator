<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc" data-theme="geo-system-black-v4">
  <title id="title">Geospatial Systems Map — Juan Manuel Torres</title>
  <desc id="desc">A dark technical map of Argentina connected to PostGIS, FastAPI, React and Cesium, LLM agents, and decision context.</desc>
  <defs>
    <radialGradient id="bg" cx="32%" cy="48%" r="82%"><stop offset="0" stop-color="#11100e"/><stop offset=".5" stop-color="#090909"/><stop offset="1" stop-color="#030303"/></radialGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#76583d"/><stop offset=".5" stop-color="#c09361"/><stop offset="1" stop-color="#806753"/></linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .title{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:19px;font-weight:700;fill:#eee9e1}
      .subtitle{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:11px;font-weight:400;fill:#827d76}
      .nodeTitle{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:14px;font-weight:700;fill:#e9e4dc}
      .nodeSub{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:9px;font-weight:500;fill:#716b64;letter-spacing:.2px}
      .micro{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:9px;font-weight:500;fill:#655f58;letter-spacing:.7px}
      .quote{font-family:Georgia,'Times New Roman',serif;font-size:13px;font-style:italic;fill:#9c958c}
      .grid{stroke:#171614;stroke-width:1}
      .map{fill:#080807;stroke:#777069;stroke-width:1.25;stroke-linejoin:round}
      .node{fill:#0a0a09;stroke:#49443e;stroke-width:1.1}
      .flow{stroke:url(#flow);stroke-width:2;fill:none;stroke-linecap:round;stroke-dasharray:5 8;animation:move 8s linear infinite}
      .flow2{stroke:#544638;stroke-width:1;fill:none;stroke-dasharray:3 7;opacity:.72}
      .pulse{animation:pulse 3.2s ease-in-out infinite;transform-origin:center}
      .pulse2{animation:pulse 3.2s ease-in-out 1.1s infinite;transform-origin:center}
      .scan{animation:scan 4s ease-out infinite;transform-origin:center}
      @keyframes move{to{stroke-dashoffset:-130}}
      @keyframes pulse{0%,100%{opacity:.55;transform:scale(.92)}50%{opacity:1;transform:scale(1.12)}}
      @keyframes scan{0%{opacity:.7;transform:scale(.4)}80%,100%{opacity:0;transform:scale(1.5)}}
    </style>
  </defs>

  <rect width="1200" height="420" rx="22" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="418" rx="21" fill="none" stroke="#181715"/>
  <g opacity=".5"><path d="M40 72H1160M40 142H1160M40 212H1160M40 282H1160M40 352H1160" class="grid"/><path d="M120 32V388M280 32V388M440 32V388M600 32V388M760 32V388M920 32V388M1080 32V388" class="grid"/></g>

  <text x="58" y="42" class="title">GEOSPATIAL SYSTEMS MAP</text>
  <text x="58" y="61" class="subtitle">Argentina · territory → spatial data → software → decision context</text>

