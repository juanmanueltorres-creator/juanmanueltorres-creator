    <text x="842" y="328" class="title">Current focus</text>
    <text x="842" y="348" class="small">Geospatial software · backend APIs · agentic workflows</text>
    <text x="842" y="364" class="small">for mining, environment and territorial intelligence</text>
  </g>
</svg>