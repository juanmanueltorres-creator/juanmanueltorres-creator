<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="240" viewBox="0 0 1100 240" role="img" aria-labelledby="title desc">
  <title id="title">Geospatial software skill tree</title>
  <desc id="desc">A dark fantasy inspired skill tree from geosciences through spatial systems, backend, AI systems, and product.</desc>
  <defs>
    <linearGradient id="path" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4b3421"/><stop offset=".5" stop-color="#c7a163"/><stop offset="1" stop-color="#4b3421"/></linearGradient>
    <radialGradient id="node"><stop offset="0" stop-color="#6b2b20"/><stop offset=".45" stop-color="#2a1711"/><stop offset="1" stop-color="#0b0907"/></radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1100" height="240" rx="15" fill="#090807" stroke="#30251b"/>
  <text x="36" y="34" fill="#aa906a" font-family="Courier New, monospace" font-size="10" font-weight="700" letter-spacing="2.4">SKILL TREE · CURRENT BUILD</text>
  <path d="M105 122 C190 88 230 154 315 122 S440 90 525 122 S650 154 735 122 S860 90 995 122" fill="none" stroke="url(#path)" stroke-width="2" stroke-dasharray="5 7" opacity=".85"/>
  <g filter="url(#glow)">
    <circle cx="105" cy="122" r="18" fill="url(#node)" stroke="#9b7548"/>
    <circle cx="315" cy="122" r="18" fill="url(#node)" stroke="#9b7548"/>
    <circle cx="525" cy="122" r="18" fill="url(#node)" stroke="#9b7548"/>
    <circle cx="735" cy="122" r="18" fill="url(#node)" stroke="#9b7548"/>
    <circle cx="995" cy="122" r="18" fill="url(#node)" stroke="#9b7548"/>
  </g>
  <g fill="#efe4d0" font-family="Palatino Linotype, Book Antiqua, Georgia, serif" font-size="15" font-weight="700" text-anchor="middle">
    <text x="105" y="82">GEOSCIENCES</text><text x="315" y="82">SPATIAL SYSTEMS</text><text x="525" y="82">BACKEND &amp; DATA</text><text x="735" y="82">AI SYSTEMS</text><text x="995" y="82">PRODUCT</text>
  </g>
  <g fill="#8e8171" font-family="Courier New, monospace" font-size="9.5" text-anchor="middle">
    <text x="105" y="158">geology · mining</text><text x="105" y="175">territory · evidence</text>
    <text x="315" y="158">PostGIS · Leaflet</text><text x="315" y="175">Cesium · GEE · OGC</text>
    <text x="525" y="158">Python · FastAPI</text><text x="525" y="175">SQL · Supabase · REST</text>
    <text x="735" y="158">LLMs · MCP</text><text x="735" y="175">LangGraph · tools</text>
    <text x="995" y="158">2D/3D · UX</text><text x="995" y="175">context · decisions</text>
  </g>
  <text x="550" y="218" text-anchor="middle" fill="#6e6255" font-family="Courier New, monospace" font-size="9" letter-spacing="1.8">SAFER · CLEANER · MORE ROBUST · WITHOUT LOSING MOMENTUM</text>
</svg>