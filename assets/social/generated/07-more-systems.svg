  <text x="72" y="104" class="eyebrow">MORE SYSTEMS</text><line x1="72" y1="126" x2="1008" y2="126" stroke="url(#goldLine)" stroke-width="1.5" opacity="0.8" /><text x="72" y="198" class="project-title">Small tools, local systems and experiments.</text><text x="72" y="250" class="body"><tspan x="72" dy="0">A second layer of builds focused on workflows,</tspan><tspan x="72" dy="30">question structuring, media production and</tspan><tspan x="72" dy="30">agent experiments.</tspan></text><rect x="72" y="350" width="404" height="410" rx="24" fill="#15120f" stroke="#3a2d21" /><text x="100" y="404" class="tool-title">Opportunity OS</text><text x="100" y="446" class="tool-body"><tspan x="100" dy="0">A local-first job-search</tspan><tspan x="100" dy="26">system for finding</tspan><tspan x="100" dy="26">opportunities, tracking</tspan><tspan x="100" dy="26">target companies,</tspan><tspan x="100" dy="26">generating</tspan><tspan x="100" dy="26">evidence-backed CVs and</tspan><tspan x="100" dy="26">organizing outreach.</tspan></text><rect x="100" y="622" rx="14" ry="14" width="94" height="28" fill="#191510" stroke="#3a2d21" /><text x="147.0" y="641" class="pill" text-anchor="middle">Python</text><rect x="204" y="622" rx="14" ry="14" width="94" height="28" fill="#191510" stroke="#3a2d21" /><text x="251.0" y="641" class="pill" text-anchor="middle">FastAPI</text><rect x="308" y="622" rx="14" ry="14" width="94" height="28" fill="#191510" stroke="#3a2d21" /><text x="355.0" y="641" class="pill" text-anchor="middle">SQLite</text><rect x="100" y="656" rx="14" ry="14" width="141" height="28" fill="#191510" stroke="#3a2d21" /><text x="170.5" y="675" class="pill" text-anchor="middle">Gmail Adapter</text><a href="https://github.com/juanmanueltorres-creator/opportunity-os"><rect x="100" y="696" rx="14" ry="14" width="136" height="32" fill="#191510" stroke="#caa56b" /><text x="168.0" y="717" class="pill-link" text-anchor="middle">repository →</text></a><rect x="548" y="350" width="404" height="410" rx="24" fill="#15120f" stroke="#3a2d21" /><text x="576" y="404" class="tool-title">Question Radar</text><text x="576" y="446" class="tool-body"><tspan x="576" dy="0">A Python tool that turns</tspan><tspan x="576" dy="26">questions into</tspan><tspan x="576" dy="26">structured data and</tspan><tspan x="576" dy="26">shows what assumptions,</tspan><tspan x="576" dy="26">evidence or next</tspan><tspan x="576" dy="26">questions are missing.</tspan></text><rect x="576" y="596" rx="14" ry="14" width="94" height="28" fill="#191510" stroke="#3a2d21" /><text x="623.0" y="615" class="pill" text-anchor="middle">Python</text><rect x="680" y="596" rx="14" ry="14" width="94" height="28" fill="#191510" stroke="#3a2d21" /><text x="727.0" y="615" class="pill" text-anchor="middle">SQLite</text><rect x="784" y="596" rx="14" ry="14" width="94" height="28" fill="#191510" stroke="#3a2d21" /><text x="831.0" y="615" class="pill" text-anchor="middle">CLI</text><rect x="576" y="630" rx="14" ry="14" width="105" height="28" fill="#191510" stroke="#3a2d21" /><text x="628.5" y="649" class="pill" text-anchor="middle">170 tests</text><a href="https://github.com/juanmanueltorres-creator/question-radar"><rect x="576" y="670" rx="14" ry="14" width="136" height="32" fill="#191510" stroke="#caa56b" /><text x="644.0" y="691" class="pill-link" text-anchor="middle">repository →</text></a><rect x="72" y="790" width="404" height="410" rx="24" fill="#15120f" stroke="#3a2d21" /><text x="100" y="844" class="tool-title">Screen2Social</text><text x="100" y="886" class="tool-body"><tspan x="100" dy="0">A local pipeline that</tspan><tspan x="100" dy="26">turns OBS screen</tspan><tspan x="100" dy="26">recordings into a</tspan><tspan x="100" dy="26">ready-to-post video,</tspan><tspan x="100" dy="26">thumbnail, metadata and</tspan><tspan x="100" dy="26">optional local</tspan><tspan x="100" dy="26">transcript.</tspan></text><rect x="100" y="1062" rx="14" ry="14" width="94" height="28" fill="#191510" stroke="#3a2d21" /><text x="147.0" y="1081" class="pill" text-anchor="middle">Python</text><rect x="204" y="1062" rx="14" ry="14" width="94" height="28" fill="#191510" stroke="#3a2d21" /><text x="251.0" y="1081" class="pill" text-anchor="middle">FFmpeg</text><rect x="100" y="1096" rx="14" ry="14" width="141" height="28" fill="#191510" stroke="#3a2d21" /><text x="170.5" y="1115" class="pill" text-anchor="middle">OBS WebSocket</text><rect x="251" y="1096" rx="14" ry="14" width="123" height="28" fill="#191510" stroke="#3a2d21" /><text x="312.5" y="1115" class="pill" text-anchor="middle">whisper.cpp</text><a href="https://github.com/juanmanueltorres-creator/screen2social"><rect x="100" y="1136" rx="14" ry="14" width="136" height="32" fill="#191510" stroke="#caa56b" /><text x="168.0" y="1157" class="pill-link" text-anchor="middle">repository →</text></a><rect x="548" y="790" width="404" height="410" rx="24" fill="#15120f" stroke="#3a2d21" /><text x="576" y="844" class="tool-title">Geo Agent</text><text x="576" y="886" class="tool-body"><tspan x="576" dy="0">A small geospatial agent</tspan><tspan x="576" dy="26">experiment built around</tspan><tspan x="576" dy="26">tools, external sources</tspan><tspan x="576" dy="26">and validation instead</tspan><tspan x="576" dy="26">of AI-only answers.</tspan></text><rect x="576" y="1010" rx="14" ry="14" width="105" height="28" fill="#191510" stroke="#3a2d21" /><text x="628.5" y="1029" class="pill" text-anchor="middle">LangChain</text><rect x="691" y="1010" rx="14" ry="14" width="105" height="28" fill="#191510" stroke="#3a2d21" /><text x="743.5" y="1029" class="pill" text-anchor="middle">LangGraph</text><rect x="576" y="1044" rx="14" ry="14" width="132" height="28" fill="#191510" stroke="#3a2d21" /><text x="642.0" y="1063" class="pill" text-anchor="middle">Tool Calling</text><a href="https://github.com/juanmanueltorres-creator/geo-agent-langgraph"><rect x="576" y="1084" rx="14" ry="14" width="136" height="32" fill="#191510" stroke="#caa56b" /><text x="644.0" y="1105" class="pill-link" text-anchor="middle">repository →</text></a><text x="1008" y="1248" class="slide-number" text-anchor="end">07 / 07</text>
