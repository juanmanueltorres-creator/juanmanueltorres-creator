  <text x="72" y="104" class="eyebrow">MORE SYSTEMS</text><line x1="72" y1="126" x2="1008" y2="126" stroke="url(#goldLine)" stroke-width="1.5" opacity="0.8" /><text x="72" y="198" class="project-title">Small tools, local systems and experiments.</text><text x="72" y="250" class="body"><tspan x="72" dy="0">A second layer of builds focused on workflows,</tspan><tspan x="72" dy="30">question structuring, media production and</tspan><tspan x="72" dy="30">agent experiments.</tspan></text><rect x="72" y="340" width="404" height="330" rx="24" fill="#15120f" stroke="#3a2d21" /><text x="100" y="394" class="tool-title">Opportunity OS</text><text x="100" y="436" class="tool-body"><tspan x="100" dy="0">A local-first job-search</tspan><tspan x="100" dy="26">system for finding</tspan><tspan x="100" dy="26">opportunities, tracking</tspan><tspan x="100" dy="26">target companies,</tspan><tspan x="100" dy="26">generating</tspan><tspan x="100" dy="26">evidence-backed CVs and</tspan><tspan x="100" dy="26">organizing outreach.</tspan></text><rect x="100" y="550" rx="14" ry="14" width="94" height="28" fill="#191510" stroke="#3a2d21" /><text x="147.0" y="569" class="pill" text-anchor="middle">Python</text><rect x="204" y="550" rx="14" ry="14" width="94" height="28" fill="#191510" stroke="#3a2d21" /><text x="251.0" y="569" class="pill" text-anchor="middle">FastAPI</text><rect x="308" y="550" rx="14" ry="14" width="94" height="28" fill="#191510" stroke="#3a2d21" /><text x="355.0" y="569" class="pill" text-anchor="middle">SQLite</text><rect x="100" y="584" rx="14" ry="14" width="141" height="28" fill="#191510" stroke="#3a2d21" /><text x="170.5" y="603" class="pill" text-anchor="middle">Gmail Adapter</text><a href="https://github.com/juanmanueltorres-creator/opportunity-os"><rect x="100" y="608" rx="14" ry="14" width="136" height="32" fill="#191510" stroke="#caa56b" /><text x="168" y="629" class="pill-link" text-anchor="middle">repository →</text></a><rect x="548" y="340" width="404" height="330" rx="24" fill="#15120f" stroke="#3a2d21" /><text x="576" y="394" class="tool-title">Question Radar</text><text x="576" y="436" class="tool-body"><tspan x="576" dy="0">A Python tool that turns</tspan><tspan x="576" dy="26">questions into</tspan><tspan x="576" dy="26">structured data and</tspan><tspan x="576" dy="26">shows what assumptions,</tspan><tspan x="576" dy="26">evidence or next</tspan><tspan x="576" dy="26">questions are missing.</tspan></text><rect x="576" y="550" rx="14" ry="14" width="94" height="28" fill="#191510" stroke="#3a2d21" /><text x="623.0" y="569" class="pill" text-anchor="middle">Python</text><rect x="680" y="550" rx="14" ry="14" width="94" height="28" fill="#191510" stroke="#3a2d21" /><text x="727.0" y="569" class="pill" text-anchor="middle">SQLite</text><rect x="784" y="550" rx="14" ry="14" width="94" height="28" fill="#191510" stroke="#3a2d21" /><text x="831.0" y="569" class="pill" text-anchor="middle">CLI</text><rect x="576" y="584" rx="14" ry="14" width="105" height="28" fill="#191510" stroke="#3a2d21" /><text x="628.5" y="603" class="pill" text-anchor="middle">170 tests</text><a href="https://github.com/juanmanueltorres-creator/question-radar"><rect x="576" y="608" rx="14" ry="14" width="136" height="32" fill="#191510" stroke="#caa56b" /><text x="644" y="629" class="pill-link" text-anchor="middle">repository →</text></a><rect x="72" y="760" width="404" height="330" rx="24" fill="#15120f" stroke="#3a2d21" /><text x="100" y="814" class="tool-title">Screen2Social</text><text x="100" y="856" class="tool-body"><tspan x="100" dy="0">A local pipeline that</tspan><tspan x="100" dy="26">turns OBS screen</tspan><tspan x="100" dy="26">recordings into a</tspan><tspan x="100" dy="26">ready-to-post video,</tspan><tspan x="100" dy="26">thumbnail, metadata and</tspan><tspan x="100" dy="26">optional local</tspan><tspan x="100" dy="26">transcript.</tspan></text><rect x="100" y="970" rx="14" ry="14" width="94" height="28" fill="#191510" stroke="#3a2d21" /><text x="147.0" y="989" class="pill" text-anchor="middle">Python</text><rect x="204" y="970" rx="14" ry="14" width="94" height="28" fill="#191510" stroke="#3a2d21" /><text x="251.0" y="989" class="pill" text-anchor="middle">FFmpeg</text><rect x="100" y="1004" rx="14" ry="14" width="141" height="28" fill="#191510" stroke="#3a2d21" /><text x="170.5" y="1023" class="pill" text-anchor="middle">OBS WebSocket</text><rect x="251" y="1004" rx="14" ry="14" width="123" height="28" fill="#191510" stroke="#3a2d21" /><text x="312.5" y="1023" class="pill" text-anchor="middle">whisper.cpp</text><a href="https://github.com/juanmanueltorres-creator/screen2social"><rect x="100" y="1028" rx="14" ry="14" width="136" height="32" fill="#191510" stroke="#caa56b" /><text x="168" y="1049" class="pill-link" text-anchor="middle">repository →</text></a><rect x="548" y="760" width="404" height="330" rx="24" fill="#15120f" stroke="#3a2d21" /><text x="576" y="814" class="tool-title">Geo Agent</text><text x="576" y="856" class="tool-body"><tspan x="576" dy="0">A small geospatial agent</tspan><tspan x="576" dy="26">experiment built around</tspan><tspan x="576" dy="26">tools, external sources</tspan><tspan x="576" dy="26">and validation instead</tspan><tspan x="576" dy="26">of AI-only answers.</tspan></text><rect x="576" y="970" rx="14" ry="14" width="105" height="28" fill="#191510" stroke="#3a2d21" /><text x="628.5" y="989" class="pill" text-anchor="middle">LangChain</text><rect x="691" y="970" rx="14" ry="14" width="105" height="28" fill="#191510" stroke="#3a2d21" /><text x="743.5" y="989" class="pill" text-anchor="middle">LangGraph</text><rect x="576" y="1004" rx="14" ry="14" width="132" height="28" fill="#191510" stroke="#3a2d21" /><text x="642.0" y="1023" class="pill" text-anchor="middle">Tool Calling</text><a href="https://github.com/juanmanueltorres-creator/geo-agent-langgraph"><rect x="576" y="1028" rx="14" ry="14" width="136" height="32" fill="#191510" stroke="#caa56b" /><text x="644" y="